[package]
name = "nothings"
version = "0.0.9"
edition = "2024"
description = "一个实用的工具库"
license = "MIT"
repository = "https://github.com/aid297/aid-rs.git"
homepage = "https://github.com/aid297/aid"
keywords = ["slice", "collection", "utility"]   # 可选，最多5个，方便搜索
categories = ["data-structures"]
readme = "README.md"

[lib]
crate-type = ["lib"]

[dependencies]
rand = "0.10.2"
flate2 = "1"
bcrypt = "0.17"
md-5 = "0.10"
sha2 = "0.10"
nothings-macros = { version = "0.0.3", path = "nothings-macros" }
serde = { version = "1.0.229", features = ["derive"] }
lz4_flex = { version = "0.14", features = ["frame"] }
zstd = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
ctr = { version = "0.10", features = ["alloc"] }
ecb = { version = "0.2", features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }

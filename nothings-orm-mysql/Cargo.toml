[package]
name = "nothings-orm-mysql"
version = "0.0.1"
edition = "2024"
description = "nothings ORM 的 MySQL 驱动"
license = "MIT"
repository = "https://github.com/aid297/aid-rs.git"

[lib]
crate-type = ["lib"]

[dependencies]
nothings-orm = { version = "0.0.1", path = "../nothings-orm" }
mysql = { version = "28.0", default-features = false, features = ["minimal-rust"] }
